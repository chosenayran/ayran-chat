<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - Ayran Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #36393f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background-color: #2f3136; padding: 32px; border-radius: 8px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 24px; color: #fff; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #b9bbbe; text-transform: uppercase; margin-bottom: 8px; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: none; background-color: #202225; color: #fff; outline: none; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #5865f2; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 8px; }
        button:hover { background-color: #4752c4; }
        .error { background-color: #ed4245; color: white; padding: 10px; border-radius: 4px; font-size: 14px; margin-bottom: 16px; text-align: center; }
        .link-text { text-align: center; margin-top: 16px; font-size: 14px; color: #8e9297; }
        .link-text a { color: #00b0f4; text-decoration: none; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Hesap Oluştur</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>
        <div class="link-text">
            Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş Yap</a>
        </div>
    </div>
</body>
</html>
